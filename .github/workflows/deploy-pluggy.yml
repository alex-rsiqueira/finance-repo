name: Deploy Pluggy ingestion

# A merge to main that touches the Pluggy function deploys it straight after
# CI, twice: atualiza-dados-pluggy for prod (raw) and atualiza-dados-pluggy-dev for
# dev (raw_dev), the same code. Same keyless sign-in and deploy account as deploy-nordigen.yml
# (DEPLOY_SA_PROD, `production` environment). The function is not invoked
# here: the first run after a deploy is the scheduled 08:15 one.

on:
  push:
    branches: [main]
    paths:
      - "GCP/cloud-function/atualiza-dados-pluggy/**"
      - ".github/workflows/deploy-pluggy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # WIF - keyless auth to Google Cloud

concurrency:
  group: deploy-pluggy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_PROD }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy atualiza-dados-pluggy
        # Builds from the folder (tests/ left out by .gcloudignore). Everything
        # the service depends on is named, so a deploy never drifts from it:
        # the account it runs as, PROJECT_ID, one instance at most, 5 minutes.
        # The items come from raw.tb_pluggy_item_registry, each read with the
        # credentials of its integration in raw.app_bank_integrations
        # (finance-backend plans/bank-integrations.md D-3); PLUGGY_ITEM_IDS, the
        # variable that once named them, is taken off the service. DATASET is not set, so it writes to raw. CPU stays
        # allocated outside requests, as for Nordigen. main(event, context) is
        # a Pub/Sub event function: without FUNCTION_SIGNATURE_TYPE=event the
        # Functions Framework calls it as an HTTP function, with one argument
        # (the Nordigen service has the same variable from its Cloud Functions
        # origin). One request at a time: Pub/Sub redelivers a
        # message it is still waiting on, and two runs at once would load the
        # same snapshot twice.
        run: |
          gcloud run deploy atualiza-dados-pluggy \
            --source GCP/cloud-function/atualiza-dados-pluggy \
            --function main \
            --base-image python311 \
            --project finances-314506 \
            --region us-central1 \
            --service-account 16973409618-compute@developer.gserviceaccount.com \
            --memory 512Mi --cpu 1 --no-cpu-throttling --max-instances 1 --concurrency 1 --timeout 300 \
            --no-allow-unauthenticated \
            --remove-env-vars PLUGGY_ITEM_IDS \
            --update-env-vars PROJECT_ID=finances-314506,FUNCTION_SIGNATURE_TYPE=event

      - name: Check the new revision is serving
        run: |
          read -r READY LATEST MEMORY CONCURRENCY <<< "$(gcloud run services describe atualiza-dados-pluggy \
            --project finances-314506 --region us-central1 \
            --format 'value(status.latestReadyRevisionName,status.latestCreatedRevisionName,spec.template.spec.containers[0].resources.limits.memory,spec.template.spec.containerConcurrency)')"
          SERVICE="$(gcloud run services describe atualiza-dados-pluggy \
            --project finances-314506 --region us-central1 --format json)"
          THROTTLING="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/cpu-throttling"] // "unset"' <<< "$SERVICE")"
          # The retired variable must be gone, not merely empty.
          ITEMS="$(jq -r '[.spec.template.spec.containers[0].env[] | select(.name == "PLUGGY_ITEM_IDS")] | length' <<< "$SERVICE")"
          SIGNATURE="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "FUNCTION_SIGNATURE_TYPE") | .value' <<< "$SERVICE")"
          echo "ready=$READY latest=$LATEST memory=$MEMORY concurrency=$CONCURRENCY cpu-throttling=$THROTTLING item-variables=$ITEMS signature=$SIGNATURE"
          test "$READY" = "$LATEST"
          test "$MEMORY" = "512Mi"
          test "$CONCURRENCY" = "1"
          test "$THROTTLING" = "false"
          test "$ITEMS" = "0"
          test "$SIGNATURE" = "event"

      - name: Deploy atualiza-dados-pluggy-dev
        # Dev's own load (finance-backend plans/bank-integrations.md, Connect a bank):
        # the same build and settings, writing raw_dev, so a bank connected from the
        # app on dev loads as on prod. It reads raw_dev's registry and integrations,
        # each item with its own integration's secrets. Its trigger is its own topic,
        # atualiza-dados-pluggy-dev, which finance-api-dev-run alone publishes to;
        # the topic, its push subscription (ack deadline 300 s) and that grant are
        # set by hand. It has no 08:15 schedule. After a load that wrote rows the
        # function starts a Dataform run of the bank tag from DATAFORM_RELEASE's
        # compilation, release-02 (prod) when unset: dev names release-dev, so its
        # loads refresh dev's tables and never start a prod run.
        run: |
          gcloud run deploy atualiza-dados-pluggy-dev \
            --source GCP/cloud-function/atualiza-dados-pluggy \
            --function main \
            --base-image python311 \
            --project finances-314506 \
            --region us-central1 \
            --service-account 16973409618-compute@developer.gserviceaccount.com \
            --memory 512Mi --cpu 1 --no-cpu-throttling --max-instances 1 --concurrency 1 --timeout 300 \
            --no-allow-unauthenticated \
            --labels env=dev \
            --update-env-vars PROJECT_ID=finances-314506,FUNCTION_SIGNATURE_TYPE=event,DATASET=raw_dev,DATAFORM_RELEASE=release-dev

      - name: Check the dev revision is serving, writes raw_dev and runs release-dev
        run: |
          SERVICE="$(gcloud run services describe atualiza-dados-pluggy-dev \
            --project finances-314506 --region us-central1 --format json)"
          READY="$(jq -r '.status.latestReadyRevisionName' <<< "$SERVICE")"
          LATEST="$(jq -r '.status.latestCreatedRevisionName' <<< "$SERVICE")"
          DATASET="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "DATASET") | .value' <<< "$SERVICE")"
          SIGNATURE="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "FUNCTION_SIGNATURE_TYPE") | .value' <<< "$SERVICE")"
          RELEASE="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "DATAFORM_RELEASE") | .value' <<< "$SERVICE")"
          echo "ready=$READY latest=$LATEST dataset=$DATASET signature=$SIGNATURE release=$RELEASE"
          test "$READY" = "$LATEST"
          test "$DATASET" = "raw_dev"
          test "$SIGNATURE" = "event"
          test "$RELEASE" = "release-dev"
