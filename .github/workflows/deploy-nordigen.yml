name: Deploy Nordigen ingestion

# A merge to main that touches the Nordigen function deploys it straight after
# CI. Same keyless sign-in and deploy account as finance-backend and
# finance-frontend (DEPLOY_SA_PROD, `production` environment). The function is
# not invoked here: GoCardless allows few calls per account and day, so the
# first run after a deploy is the scheduled 08:00 one. The same build is deployed again as
# atualiza-dados-nordigen-dev, writing raw_dev, with no schedule.

on:
  push:
    branches: [main]
    paths:
      - "GCP/cloud-function/atualiza-dados-nordigen/**"
      - ".github/workflows/deploy-nordigen.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # WIF - keyless auth to Google Cloud

concurrency:
  group: deploy-nordigen
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_PROD }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy atualiza-dados-nordigen
        # Builds from the folder (tests/ left out by .gcloudignore). Everything
        # the service depends on is named, so a deploy never drifts from it:
        # the account it runs as, PROJECT_ID, one instance at most, 5 minutes.
        # DATASET is not set, so it writes to raw.
        # The Pub/Sub trigger gets its 200 within seconds while the run goes on
        # for minutes, so CPU stays allocated outside requests: with throttling
        # on, the calls to the bank stall until GoCardless drops them.
        run: |
          gcloud run deploy atualiza-dados-nordigen \
            --source GCP/cloud-function/atualiza-dados-nordigen \
            --function main \
            --base-image python311 \
            --project finances-314506 \
            --region us-central1 \
            --service-account 16973409618-compute@developer.gserviceaccount.com \
            --memory 512Mi --cpu 1 --no-cpu-throttling --max-instances 1 --timeout 300 \
            --update-env-vars "PROJECT_ID=finances-314506"

      - name: Check the new revision is serving
        run: |
          read -r READY LATEST MEMORY <<< "$(gcloud run services describe atualiza-dados-nordigen \
            --project finances-314506 --region us-central1 \
            --format 'value(status.latestReadyRevisionName,status.latestCreatedRevisionName,spec.template.spec.containers[0].resources.limits.memory)')"
          THROTTLING="$(gcloud run services describe atualiza-dados-nordigen \
            --project finances-314506 --region us-central1 --format json \
            | jq -r '.spec.template.metadata.annotations["run.googleapis.com/cpu-throttling"] // "unset"')"
          echo "ready=$READY latest=$LATEST memory=$MEMORY cpu-throttling=$THROTTLING"
          test "$READY" = "$LATEST"
          test "$MEMORY" = "512Mi"
          test "$THROTTLING" = "false"

      - name: Deploy atualiza-dados-nordigen-dev
        # Dev's own load (finance-backend plans/bank-integrations.md D-23): the same build and
        # settings, writing raw_dev, so a bank connected from the app on dev loads as on prod. It
        # reads raw_dev's registry and integrations; it is published to only by
        # finance-api-dev-run, with the requisitions of a bank just connected, never on a
        # schedule. Its trigger is its own topic, atualiza-dados-nordigen-dev; the topic, the
        # trigger's subscription (ack deadline 600 s, as prod's) and the publish grant are set by
        # hand. After a load that wrote rows the function starts a Dataform run of the bank tag
        # from DATAFORM_RELEASE's compilation: dev names release-dev, so its loads never start a
        # prod run.
        run: |
          gcloud run deploy atualiza-dados-nordigen-dev \
            --source GCP/cloud-function/atualiza-dados-nordigen \
            --function main \
            --base-image python311 \
            --project finances-314506 \
            --region us-central1 \
            --service-account 16973409618-compute@developer.gserviceaccount.com \
            --memory 512Mi --cpu 1 --no-cpu-throttling --max-instances 1 --concurrency 1 --timeout 300 \
            --no-allow-unauthenticated \
            --labels env=dev \
            --update-env-vars PROJECT_ID=finances-314506,FUNCTION_SIGNATURE_TYPE=event,DATASET=raw_dev,DATAFORM_RELEASE=release-dev

      - name: Check the dev revision is serving, writes raw_dev and runs release-dev
        run: |
          SERVICE="$(gcloud run services describe atualiza-dados-nordigen-dev \
            --project finances-314506 --region us-central1 --format json)"
          READY="$(jq -r '.status.latestReadyRevisionName' <<< "$SERVICE")"
          LATEST="$(jq -r '.status.latestCreatedRevisionName' <<< "$SERVICE")"
          DATASET="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "DATASET") | .value' <<< "$SERVICE")"
          SIGNATURE="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "FUNCTION_SIGNATURE_TYPE") | .value' <<< "$SERVICE")"
          RELEASE="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "DATAFORM_RELEASE") | .value' <<< "$SERVICE")"
          echo "ready=$READY latest=$LATEST dataset=$DATASET signature=$SIGNATURE release=$RELEASE"
          test "$READY" = "$LATEST"
          test "$DATASET" = "raw_dev"
          test "$SIGNATURE" = "event"
          test "$RELEASE" = "release-dev"
